[project]
name = "up-agents"
version = "0.1.0"
description = "Терминальная агентная система с поддержкой различных LLM провайдеров и MCP протокола"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11.4",
    "pydantic-ai>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
up-agents = "src.llms.main:main"

[tool.uv]
dev-dependencies = [
    "ruff>=0.8.4",
    "black>=24.10.0",
    "pytest>=8.3.4",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # line too long

[tool.black]
line-length = 88
target-version = ["py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''
